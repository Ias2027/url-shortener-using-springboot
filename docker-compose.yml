services:
  database:
    image: mysql:8
    environment:
      MYSQL_DATABASE: url_shortener
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./url-shortener
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://database:3306/url_shortener?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql-data:
