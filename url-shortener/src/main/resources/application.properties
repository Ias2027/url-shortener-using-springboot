# ---- Server ----
server.port=8080

# ---- Database (local MySQL) ----
# Reads from environment variables if present (used for cloud deployment),
# falls back to these local defaults otherwise.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/url_shortener?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update = auto-creates/updates tables from your @Entity classes on startup.
# Good for dev; in a real production system you'd use migration tools
# (Flyway/Liquibase) instead - worth mentioning if asked about this.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
