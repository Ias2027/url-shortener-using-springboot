# ---- Server ----
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---- Database ----
# Local development uses a persistent H2 file. Set DB_URL, DB_USERNAME, and
# DB_PASSWORD to use MySQL in Docker or a managed database.
spring.datasource.url=${DB_URL:jdbc:h2:file:./url_shortener;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Expose only a minimal health check; never expose environment or configuration.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
